[project]
name = "skill-integrity-demo"
version = "0.1.0"
description = "Demonstration of cross-episode skill poisoning and provenance-based endorsement"
readme = "README.md"
authors = [
    { name = "yukangZhuu", email = "zhuyukang2000@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
skill-integrity = "skill_integrity.cli:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "skill_integrity"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
