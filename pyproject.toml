[project]
name = "skill-taint"
version = "0.2.0"
description = "Reflection-laundering experiments and provenance-partitioned skill quarantine"
readme = "README.md"
authors = [
    { name = "yukangZhuu", email = "zhuyukang2000@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
]

[project.scripts]
skill-integrity = "skill_taint.cli:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "skill_taint"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
