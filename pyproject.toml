[project]
name = "skill-taint"
version = "0.2.0"
description = "Measures whether agent skills absorb unverified tool output, and evaluates provenance-partitioned reflection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yukang Zhu", email = "zhuyukang2000@gmail.com" }
]
keywords = [
    "llm-agents",
    "ai-security",
    "prompt-injection",
    "agent-memory",
    "information-flow-control",
    "evaluation",
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
]

[project.urls]
Homepage = "https://github.com/kayneZhu/skill-taint"
Repository = "https://github.com/kayneZhu/skill-taint"
Documentation = "https://github.com/kayneZhu/skill-taint/blob/main/docs/report.md"

[project.scripts]
skill-taint = "skill_taint.cli:main"
skill-integrity = "skill_taint.cli:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "skill_taint"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
